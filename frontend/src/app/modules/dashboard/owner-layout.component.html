<app-navbar *ngIf="showNavbar"></app-navbar>

<div class="ow-root">

  <!-- ══ Sidebar ══ -->
  <aside class="ow-sidebar">
    <a routerLink="/profile" class="ow-profile ow-profile-link">
      <div class="ow-avatar">
        <img *ngIf="user?.avatar" [src]="user!.avatar" alt="">
        <span *ngIf="!user?.avatar">{{ (user?.name || 'U')[0] }}</span>
      </div>
      <div class="ow-profile-info">
        <p class="ow-profile-name">{{ user?.name || 'User' }}</p>
        <span class="ow-profile-role">Owner</span>
      </div>
    </a>

    <nav class="ow-nav">
      <p class="ow-nav-section">MANAGE</p>
      <a routerLink="/dashboard" routerLinkActive="ow-nav-active" [routerLinkActiveOptions]="{exact:true}" class="ow-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </a>
      <a routerLink="/my-listings" routerLinkActive="ow-nav-active" class="ow-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        My Listings
      </a>
      <a routerLink="/listings/add" routerLinkActive="ow-nav-active" class="ow-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        Add New Item
      </a>
      <a routerLink="/earnings" routerLinkActive="ow-nav-active" class="ow-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        Earnings
      </a>
      <a routerLink="/bookings" routerLinkActive="ow-nav-active" class="ow-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/></svg>
        Bookings
      </a>
      <a routerLink="/reviews" routerLinkActive="ow-nav-active" class="ow-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.4 7.4H22l-6 4.4 2.3 7.2-6.3-4.6L5.7 21l2.3-7.2-6-4.4h7.6z"/></svg>
        Reviews
      </a>
      <a routerLink="/inspections" routerLinkActive="ow-nav-active" class="ow-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        Inspections &amp; Proofs
      </a>
      <a routerLink="/messages" routerLinkActive="ow-nav-active" class="ow-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
      </a>

      <p class="ow-nav-section">ACCOUNT</p>
      <a routerLink="/profile" routerLinkActive="ow-nav-active" class="ow-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
      <a routerLink="/wallet" routerLinkActive="ow-nav-active" class="ow-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        Wallet
      </a>
      <a routerLink="/support" routerLinkActive="ow-nav-active" class="ow-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
        Help &amp; Support
      </a>
      <a routerLink="/profile" routerLinkActive="ow-nav-active" class="ow-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </a>
    </nav>

    <!-- Grow income card -->

    <button class="ow-logout" (click)="logout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log Out
    </button>
  </aside>

  <!-- ══ Main column ══ -->
  <div class="ow-main">
    <main class="ow-content">
      <ng-content></ng-content>
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Logout Confirmation Modal -->
  <div *ngIf="showLogoutConfirm()" class="ow-logout-overlay" (click)="cancelLogout()">
    <div class="ow-logout-modal" (click)="$event.stopPropagation()">
      <div class="ow-logout-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </div>
      <h3 class="ow-logout-title">Log out?</h3>
      <p class="ow-logout-text">Are you sure you want to log out of your account?</p>
      <div class="ow-logout-actions">
        <button class="ow-logout-cancel" (click)="cancelLogout()">Cancel</button>
        <button class="ow-logout-confirm" (click)="confirmLogout()">Log Out</button>
      </div>
    </div>
  </div>

</div>

<app-navbar *ngIf="showNavbar"></app-navbar>

<div class="rn-root">

  <!-- ══ Sidebar ══ -->
  <aside class="rn-sidebar">
    <a routerLink="/profile" class="rn-profile rn-profile-link">
      <div class="rn-avatar">
        <img *ngIf="user?.avatar" [src]="user!.avatar" alt="">
        <span *ngIf="!user?.avatar">{{ (user?.name || 'U')[0] }}</span>
      </div>
      <div class="rn-profile-info">
        <p class="rn-profile-name">{{ user?.name || 'User' }}</p>
        <span class="rn-profile-role">Renter</span>
      </div>
    </a>

    <nav class="rn-nav">
      <a routerLink="/dashboard" routerLinkActive="rn-nav-active" [routerLinkActiveOptions]="{exact:true}" class="rn-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </a>
      <a routerLink="/bookings" routerLinkActive="rn-nav-active" class="rn-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/></svg>
        My Bookings
      </a>
      <a routerLink="/my-reviews" routerLinkActive="rn-nav-active" class="rn-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.4 7.4H22l-6 4.4 2.3 7.2-6.3-4.6L5.7 21l2.3-7.2-6-4.4h7.6z"/></svg>
        My Reviews
      </a>
      <a routerLink="/inspections" routerLinkActive="rn-nav-active" class="rn-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        Inspections &amp; Proofs
      </a>
      <a routerLink="/listings" routerLinkActive="rn-nav-active" class="rn-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        Browse Items
      </a>
      <a routerLink="/wallet" routerLinkActive="rn-nav-active" class="rn-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        Wallet
      </a>
      <a routerLink="/messages" routerLinkActive="rn-nav-active" class="rn-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
      </a>
      <a routerLink="/profile" routerLinkActive="rn-nav-active" class="rn-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
      <a routerLink="/track" routerLinkActive="rn-nav-active" class="rn-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Track Order
      </a>
    </nav>

    <button class="rn-logout" (click)="logout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log Out
    </button>
  </aside>

  <!-- ══ Main column ══ -->
  <div class="rn-main">
    <main class="rn-content">
      <ng-content></ng-content>
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Logout Confirmation Modal -->
  <div *ngIf="showLogoutConfirm()" class="rn-logout-overlay" (click)="cancelLogout()">
    <div class="rn-logout-modal" (click)="$event.stopPropagation()">
      <div class="rn-logout-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </div>
      <h3 class="rn-logout-title">Log out?</h3>
      <p class="rn-logout-text">Are you sure you want to log out of your account?</p>
      <div class="rn-logout-actions">
        <button class="rn-logout-cancel" (click)="cancelLogout()">Cancel</button>
        <button class="rn-logout-confirm" (click)="confirmLogout()">Log Out</button>
      </div>
    </div>
  </div>

</div>

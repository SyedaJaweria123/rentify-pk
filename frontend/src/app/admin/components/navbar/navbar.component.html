<header class="admin-navbar">

  <div class="navbar-left-group">
    <!-- Logo — EXACT copy of the real site navbar's logo (house icon, no
         colored box, single-line "Rentify" text) with a small Admin pill -->
    <a routerLink="/admin/dashboard" class="nb-logo">
      <img src="/rentify-logo.png" class="nb-logo-img" alt="Rentify" />
      <span class="nb-logo-pill">Admin</span>
    </a>

    <!-- Hamburger + Breadcrumb -->
    <div class="navbar-left">
      <button class="hamburger-btn" (click)="toggleMobile.emit()" aria-label="Menu">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Right: Search + Actions -->
  <div class="navbar-right">

    <!-- Search -->
    <div class="search-box">
      <span class="search-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      </span>
      <input [(ngModel)]="searchQuery" (ngModelChange)="onSearch($event)"
        type="text" placeholder="Search..." class="search-input">
    </div>

    <!-- Notification Bell -->
    <div class="notif-wrapper">
      <button class="icon-btn" (click)="toggleNotifMenu()" title="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span *ngIf="notifSvc.unreadCount() > 0" class="notif-badge">{{ notifSvc.unreadCount() }}</span>
      </button>
      <!-- Notif Dropdown -->
      <div *ngIf="notifMenuOpen" class="notif-dropdown">
        <div class="dropdown-head">
          <span class="dropdown-title">Notifications</span>
          <button class="mark-all-btn" (click)="markAllRead()" *ngIf="recentNotifs.length">Mark all read</button>
        </div>
        <div class="notif-list">
          <div *ngIf="notifsLoading" class="notif-empty">Loading…</div>
          <div *ngFor="let n of recentNotifs" class="notif-item" [class.unread]="!n.isRead" (click)="openNotif(n)">
            <span class="notif-dot" *ngIf="!n.isRead"></span>
            <div class="notif-content">
              <p class="notif-title">{{ n.title }}</p>
              <p class="notif-time">{{ relativeTime(n.createdAt) }}</p>
            </div>
          </div>
          <div *ngIf="!notifsLoading && !recentNotifs.length" class="notif-empty">No notifications</div>
        </div>
        <a routerLink="/admin/notifications" (click)="closeMenus()" class="notif-footer">View all →</a>
      </div>
    </div>

    <!-- Theme Toggle -->
    <button class="icon-btn" (click)="toggleTheme()" [title]="darkMode ? 'Light Mode' : 'Dark Mode'">
      <svg *ngIf="!darkMode" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg *ngIf="darkMode" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>

    <!-- Profile Dropdown -->
    <div class="profile-wrapper">
      <button class="profile-btn" (click)="toggleProfileMenu()">
        <div class="profile-avatar">
          <img *ngIf="userAvatar" [src]="userAvatar" alt="avatar" class="avatar-img">
          <span *ngIf="!userAvatar" class="avatar-initial">{{ userInitial }}</span>
        </div>
        <div class="profile-info">
          <span class="profile-name">{{ userName }}</span>
          <span class="profile-role">{{ userRole }}</span>
        </div>
        <svg class="chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>
      <!-- Profile Menu -->
      <div *ngIf="profileMenuOpen" class="profile-dropdown">
        <a routerLink="/profile" (click)="closeMenus()" class="profile-menu-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
          My Profile
        </a>
        <a routerLink="/admin/settings" (click)="closeMenus()" class="profile-menu-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.86 1 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
        <a routerLink="/" (click)="closeMenus()" class="profile-menu-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
          Back to App
        </a>
        <div class="profile-divider"></div>
        <button (click)="logout()" class="profile-menu-item profile-logout">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Logout
        </button>
      </div>
    </div>

  </div>
</header>

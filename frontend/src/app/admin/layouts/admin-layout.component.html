<div class="admin-layout">
  <!-- Navbar now spans the FULL width across the top, above everything else -->

  <div class="admin-body">
    <app-admin-sidebar

      (mobileClose)="mobileOpen.set(false)">

      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Floating Button -->
<div class="chat-fab" (click)="toggleChat()" [class.open]="isOpen" title="RentBot AI Assistant">
  <div class="fab-icon">
    <span *ngIf="!isOpen"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V5M12 5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><path d="M8 16h8"/></svg></span>
    <span *ngIf="isOpen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
  </div>
  <div class="fab-pulse"></div>
  <div class="unread-badge" *ngIf="unreadCount > 0 && !isOpen">{{ unreadCount }}</div>
  <div class="fab-tooltip" *ngIf="!isOpen">Chat with RentBot AI</div>
</div>

<!-- Chat Window -->
<div class="chat-window" [class.open]="isOpen" [class.minimized]="isMinimized">

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-left">
      <div class="bot-avatar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V5M12 5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><path d="M8 16h8"/></svg></div>
      <div class="bot-info">
        <div class="bot-name">RentBot <span class="ai-badge">Gemini AI</span></div>
        <div class="bot-status">
          <span class="status-dot"></span>
          {{ loading ? 'Soch raha hoon...' : 'Online — Ready to help!' }}
        </div>
      </div>
    </div>
    <div class="chat-header-actions">
      <button class="hdr-btn" (click)="minimizeChat()" title="Minimize"><svg width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round'><path [attr.d]="isMinimized ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6'"/></svg></button>
      <button class="hdr-btn" (click)="closeChat()" title="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
  </div>

  <!-- Body -->
  <div class="chat-body" *ngIf="!isMinimized">
    <div class="messages" #msgContainer>

      <!-- Messages -->
      <div *ngFor="let msg of messages" class="msg-row" [class.user-row]="msg.role==='user'">
        <div class="msg-avatar" *ngIf="msg.role==='ai'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V5M12 5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><path d="M8 16h8"/></svg></div>
        <div class="msg-bubble" [class.user-bubble]="msg.role==='user'" [class.ai-bubble]="msg.role==='ai'">
          <!-- Loading dots -->
          <div class="typing-dots" *ngIf="msg.loading">
            <span></span><span></span><span></span>
          </div>
          <!-- Message text -->
          <div *ngIf="!msg.loading" [innerHTML]="formatText(msg.text)"></div>
          <!-- Time -->
          <div class="msg-time" *ngIf="!msg.loading">
            {{ msg.time | date:'hh:mm a' }}
          </div>
        </div>
        <div class="msg-avatar user-av" *ngIf="msg.role==='user'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div>
      </div>

    </div>

    <!-- Quick Replies (show only at start) -->
    <div class="quick-replies" *ngIf="messages.length <= 1">
      <button *ngFor="let q of quickReplies" class="quick-chip" (click)="quickReply(q)">
        {{ q }}
      </button>
    </div>

    <!-- Input -->
    <div class="chat-input-row">
      <textarea
        class="chat-input"
        [(ngModel)]="input"
        (keydown)="onKeyDown($event)"
        placeholder="Message likhen... (Enter to send)"
        rows="1"
        [disabled]="loading">
      </textarea>
      <button class="send-btn" (click)="sendMessage()" [disabled]="!input.trim() || loading">
        <span *ngIf="!loading"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg></span>
        <span *ngIf="loading" class="send-spin"></span>
      </button>
    </div>
    <div class="powered-by">Powered by Google Gemini AI</div>
  </div>

</div>
